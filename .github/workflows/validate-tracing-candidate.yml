name: Validate tracing candidate

on:
  push:
    branches:
      - codex/validate-worker-otlp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
      TZ: UTC
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 83a398535bfe1264bcafd2b73970b299fcdfee9c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install test prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 ripgrep
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck candidate
        run: npm run check
      - name: Focused API tracing
        run: npm test -w @space/api -- workflow-start-tracing dot-goals.test memory-consolidation-coordinator memory-mutation-coordinator trace-correlation otlp-span-exporter
      - name: Real Temporal tracing and replay
        run: npm test -w @space/worker -- otlp-tracing.integration tracing-protocol activity-observability
      - name: Complete repository test suite
        run: npm test
      - name: Build candidate
        run: npm run build
      - name: Verify checkout is clean
        run: git diff --exit-code
